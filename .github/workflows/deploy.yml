name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
        env:
          SITE_URL: https://blog.qselery.cc.cd

      - name: Publish build log
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git checkout -B ci-logs
            cp build.log ci-build.log
            git add -f ci-build.log
            git commit -m "ci: build log for ${GITHUB_SHA:0:7}" || true
            git push -f origin ci-logs || true
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2d6790d2326f1097c7147e2895c7732c
          wranglerVersion: '4.153.0'
          command: deploy
