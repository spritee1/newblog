# Sveltia CMS 配置（Firefly 主题）
# 仓库 spritee1/newblog，站点 https://blog.qselery.cc.cd
# 登录：个人访问令牌（Fine-grained token，只给本仓库 Contents: Read and write）

backend:
  name: github
  repo: spritee1/newblog
  branch: main
  # 单人写作不需要 base_url；要多人 OAuth 登录时再部署 sveltia-cms-auth 并取消注释
  # base_url: https://your-auth-worker.workers.dev
  # auth_endpoint: auth

site_url: https://blog.qselery.cc.cd
display_url: https://blog.qselery.cc.cd
logo_url: ''
locale: zh_cn

media_folder: public/images
public_folder: /images

# 上传图片自动转 webp、限制长边 2048，避免手机原图把保存请求撑爆
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} · {{published}}'
    sortable_fields: ['published', 'title']
    fields:
      - name: title
        label: 标题
        widget: string
      - name: published
        label: 发布日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false
      - name: updated
        label: 更新日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - name: description
        label: 摘要
        widget: text
        required: false
        hint: 列表和 SEO 里显示的简介，一两句话。
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
      - name: category
        label: 分类
        widget: string
        required: false
      - name: image
        label: 封面图
        widget: image
        required: false
        choose_url: false
      - name: draft
        label: 草稿
        widget: boolean
        default: false
        required: false
      - name: pinned
        label: 置顶
        widget: boolean
        default: false
        required: false
      - name: comment
        label: 允许评论
        widget: boolean
        default: true
        required: false
      - name: series
        label: 系列
        widget: string
        required: false
      - name: seriesOrder
        label: 系列序号
        widget: number
        required: false
      - name: body
        label: 正文
        widget: markdown
